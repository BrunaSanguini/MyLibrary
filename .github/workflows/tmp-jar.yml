name: Temporary jar check

on:
  push:
    branches: [build/frontend-no-jar]

permissions:
  contents: read

jobs:
  jar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B -ntp package -DskipTests
      - name: Check the jar
        run: |
          java -jar target/minha-livraria-0.1.0-SNAPSHOT.jar --app.data-dir="$RUNNER_TEMP/ml" &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8471/actuator/health/readiness && break; sleep 1; done
          echo "--- /"; curl -s -o /dev/null -w "%{http_code} %{content_type}\n" http://127.0.0.1:8471/
          curl -s http://127.0.0.1:8471/ | grep -o '<title>.*</title>\|<ml-root>'
          echo "--- /estante"; curl -s -w "\n%{http_code}\n" http://127.0.0.1:8471/estante | grep -o '<ml-root>\|^[0-9]*$'
          echo "--- /api/v1/inexistente"; curl -s -w "\n%{http_code} %{content_type}\n" http://127.0.0.1:8471/api/v1/inexistente
          echo "--- asset"; curl -s -o /dev/null -w "%{http_code}\n" "http://127.0.0.1:8471/$(curl -s http://127.0.0.1:8471/ | grep -o 'main-[A-Z0-9]*\.js' | head -1)"
          echo "--- jar size"; ls -lh target/*.jar
          unzip -l target/minha-livraria-0.1.0-SNAPSHOT.jar | grep -c "BOOT-INF/classes/static/"
