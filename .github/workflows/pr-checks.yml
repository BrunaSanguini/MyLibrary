name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # The PR title becomes the squash commit on main, so it must follow Conventional Commits.
      # Types and scopes mirror CONTRIBUTING.md.
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            perf
            style
            build
            ci
            chore
            revert
          scopes: |
            books
            reading
            lists
            goals
            profile
            images
            openlibrary
            shelf
            backend
            frontend
            build
            ci
            deps
            adr
          requireScope: false
          # Starts with a lowercase letter, no trailing period, at most 72 characters.
          subjectPattern: '^[a-zà-ÿ](?!.*\.$).{0,71}$'
          subjectPatternError: |
            A descrição "{subject}" do título "{title}" precisa começar com letra minúscula
            (não com número ou símbolo), não pode terminar com ponto e deve ter no máximo 72 caracteres.

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
