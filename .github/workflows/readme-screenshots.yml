name: README screenshots

# Takes the pictures of the README from the real app with the sample collection
# (frontend/e2e/readme-screenshots.spec.ts) and keeps them as an artifact, to be copied to
# docs/images/. Run by hand when the screens change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the jar
        working-directory: backend
        run: ./mvnw -B -ntp package -DskipTests
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Take the pictures
        working-directory: frontend
        env:
          TZ: America/Sao_Paulo
        run: npm run readme:screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-screenshots
          path: docs/images/
          retention-days: 7
      # Also in the log, for whoever cannot download artifacts: `base64 -d` gives the file back.
      - name: Print the pictures as base64
        run: |
          for image in docs/images/*.png; do
            echo "::group::$(basename "$image")"
            base64 "$image"
            echo "::endgroup::"
          done
