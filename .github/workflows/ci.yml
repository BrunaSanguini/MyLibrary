name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # docs/openapi.json is the API contract: checked by the back-end tests
          # and the source of the front-end API types.
          filters: |
            backend:
              - 'backend/**'
              - '.java-version'
              - 'docs/openapi.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.nvmrc'
              - 'docs/openapi.json'
              - '.github/workflows/ci.yml'

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify
        run: ./mvnw -B -ntp verify -Pci,skip-frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: backend/target/site/jacoco/jacoco.xml
          retention-days: 3
      # On failure, keep what is needed to fix the PR without a local build:
      # the formatting patch, the generated API contract and the test reports.
      - name: Prepare diagnostics
        if: failure()
        run: |
          ./mvnw -B -ntp -q spotless:apply || true
          mkdir -p target
          git diff --output=target/spotless.patch -- . || true
          # Also printed in the log, which can be read without downloading the artifact.
          for file in target/spotless.patch target/openapi.json; do
            if [ -s "$file" ]; then
              echo "::group::$file"
              cat "$file"
              echo "::endgroup::"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: backend-diagnostics
          path: |
            backend/target/spotless.patch
            backend/target/openapi.json
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Browser-mode tests of shared/ui run in Chromium.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      # Coverage of both test modes, for SonarQube Cloud. The paths in lcov are relative to
      # frontend/, and Sonar resolves them from the repository root.
      - name: Test
        run: |
          npm run api:types
          npm run test:unit -- --coverage
          sed 's#^SF:#SF:frontend/#' coverage/minha-livraria/lcov.info > coverage/lcov-unit.info
          npm run test:browser -- --coverage
          sed 's#^SF:#SF:frontend/#' coverage/minha-livraria/lcov.info > coverage/lcov-browser.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov-*.info
          retention-days: 3
      - name: Type-check E2E tests
        run: npm run e2e:typecheck
      - name: Build
        run: npm run build

  # Runs when the back-end or the front-end changed and neither of them failed.
  e2e:
    name: e2e
    needs: [changes, backend, frontend]
    if: >-
      !cancelled()
      && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
      && needs.backend.result != 'failure' && needs.frontend.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The full jar: the Maven build also installs the front-end dependencies and builds it.
      - name: Build the jar
        working-directory: backend
        run: ./mvnw -B -ntp package -DskipTests
      - name: Install Chromium and Firefox
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox
      - name: Run E2E tests
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Fails when the quality gate fails (sonar.qualitygate.wait in sonar-project.properties).
  sonar:
    name: sonar
    needs: [changes, backend, frontend]
    if: >-
      !cancelled()
      && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
      && needs.backend.result != 'failure' && needs.frontend.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: Sonar uses blame to tell new code from old.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: backend/pom.xml
      # The Java analysis reads the bytecode, also when only the front-end changed.
      - name: Compile the back-end
        working-directory: backend
        run: ./mvnw -B -ntp compile -Pskip-frontend
      # Coverage of the jobs that ran; a skipped job leaves no report.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-reports
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Single required check for the main branch: it summarizes the jobs above,
  # so a PR that skips a job (e.g. docs only) is not left waiting for it.
  ci:
    name: ci
    if: always()
    needs: [changes, backend, frontend, e2e, sonar]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::Jobs que falharam ou foram cancelados:"
            echo "$failed"
            exit 1
          fi
          echo "Todos os jobs passaram ou foram pulados."
