<header class="bar">
  <a class="logo" routerLink="/" aria-label="Ex·Libru, início">
    <ml-crest [width]="28" />
    <ml-wordmark class="wordmark" />
  </a>

  <nav aria-label="Principal">
    <ul class="menu">
      @for (item of menu; track item.path) {
        <li>
          <a [routerLink]="item.path" [attr.aria-current]="isCurrent(item) ? 'page' : null">{{
            item.label
          }}</a>
        </li>
      }
    </ul>
  </nav>

  <div class="actions">
    <ml-search-panel />

    <button
      type="button"
      class="icon-button"
      aria-label="Alternar tema claro e escuro"
      [attr.aria-pressed]="dark()"
      (click)="toggleTheme()"
    >
      <ml-icon [name]="dark() ? 'sun' : 'moon'" />
    </button>

    <a
      class="avatar"
      routerLink="/perfil"
      aria-label="Meu perfil"
      [attr.aria-current]="profileActive() ? 'page' : null"
    >
      @if (avatarUrl(); as url) {
        <img [src]="url" alt="" />
      } @else if (initial(); as letter) {
        <span aria-hidden="true">{{ letter }}</span>
      } @else {
        <ml-icon name="user" />
      }
    </a>
  </div>
</header>
