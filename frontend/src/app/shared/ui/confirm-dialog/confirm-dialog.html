<dialog #dialog class="dialog" [attr.aria-labelledby]="titleId">
  <h2 class="title" [id]="titleId">{{ title() }}</h2>
  @if (message()) {
    <p class="message">{{ message() }}</p>
  }
  <div class="actions">
    <button mlButton="secondary" type="button" autofocus [disabled]="busy()" (click)="close()">
      {{ cancelLabel() }}
    </button>
    <button mlButton="primary" type="button" [disabled]="busy()" (click)="confirmed.emit()">
      {{ confirmLabel() }}
    </button>
  </div>
</dialog>
