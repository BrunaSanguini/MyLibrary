@if (size() === 'pinned') {
  <svg class="arch" viewBox="0 0 260 300" focusable="false">
    <path d="M10 299 V120 Q10 10 130 1 Q250 10 250 120 V299" />
  </svg>
}
<span class="cover left">
  @if (left(); as url) {
    <img [src]="url" alt="" />
  }
</span>
<span class="cover right">
  @if (right(); as url) {
    <img [src]="url" alt="" />
  }
</span>
<span class="cover front" [style.background]="front() ? null : background()">
  @if (front(); as url) {
    <img [src]="url" alt="" />
  } @else {
    <span class="name">{{ name() }}</span>
  }
</span>
