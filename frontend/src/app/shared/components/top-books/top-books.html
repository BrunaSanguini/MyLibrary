<section class="relative w-full overflow-hidden bg-gradient-to-b from-black via-[#05050f] to-[#0a0a1a] px-6 py-24">

  <div class="pointer-events-none absolute left-1/2 top-1/3 h-72 w-72 -translate-x-1/2 rounded-full bg-amber-500/10 blur-[120px]"></div>

  <div class="relative z-10 mx-auto max-w-6xl">

    <div class="mb-16 text-center">
      <h2 class="font-serif text-4xl font-bold text-zinc-50 md:text-5xl">
        Entre todos os outros
      </h2>
    </div>

    <div class="flex flex-col items-center justify-center gap-10 md:flex-row md:items-end md:gap-8">
      @for (book of books; track book.slug) {
        <button
          type="button"
          (click)="navigateToBook(book.slug)"
          class="group flex cursor-pointer flex-col items-center text-center outline-none transition-transform duration-500 ease-out"
          [class.w-64]="book.rank === 1"
          [class.w-52]="book.rank === 2"
          [class.w-52]="book.rank === 3"
          [class.-translate-y-8]="book.rank === 1"
          [class.translate-y-4]="book.rank !== 1">

          <div class="relative mb-5 overflow-hidden rounded-lg border border-white/10 shadow-2xl shadow-black/60 ring-1 transition-all duration-500 ease-out group-hover:-translate-y-2 group-hover:scale-105"
               [ngClass]="[getRankStyle(book.rank).ring, getRankStyle(book.rank).glow]">

            <img [src]="book.cover" [alt]="book.title"
                 class="aspect-[2/3] h-full w-full object-cover"/>

            <span class="absolute left-3 top-3 flex h-9 w-9 items-center justify-center rounded-full font-sans text-sm font-bold"
                  [ngClass]="getRankStyle(book.rank).badge">
              #{{ book.rank }}
            </span>

            <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent"></div>
          </div>

          <h3 class="font-serif font-semibold text-zinc-50"
              [class.text-3xl]="book.rank === 1"
              [class.text-2xl]="book.rank !== 1">
            {{ book.title }}
          </h3>

          <p class="mt-1 font-sans text-sm text-zinc-400">{{ book.author }}</p>

        </button>
      }
    </div>

  </div>
</section>
