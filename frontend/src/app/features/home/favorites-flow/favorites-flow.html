<section id="favoritos" aria-labelledby="titulo-favoritos">
  <div class="section-head">
    <div class="titles">
      <p class="eyebrow">Da sua estante</p>
      <h2 id="titulo-favoritos">Favoritos</h2>
    </div>
    <span class="rule" aria-hidden="true"></span>
    <a class="more" routerLink="/estante" [queryParams]="{ favorite: true }">
      Ver todos <ml-icon name="arrow-right" [size]="16" />
    </a>
  </div>

  <div
    class="stage"
    (mouseenter)="rest(true)"
    (mouseleave)="rest(false)"
    (focusin)="rest(true)"
    (focusout)="blur($event)"
  >
    @for (item of items(); track item.book.id) {
      <button
        type="button"
        class="item"
        [class.center]="item.offset === 0"
        [style.--offset]="item.offset"
        [style.--distance]="item.offset < 0 ? -item.offset : item.offset"
        [attr.aria-label]="labelOf(item)"
        [attr.aria-hidden]="item.hidden ? 'true' : null"
        [attr.tabindex]="item.hidden ? -1 : null"
        (click)="pick(item)"
      >
        <ml-book-cover
          size="md"
          [title]="item.book.title"
          [author]="item.book.authors[0]"
          [coverUrl]="item.book.coverUrl ?? undefined"
        />
        @if (item.offset === 0 && item.book.rating) {
          <span class="badge">★ {{ formatRating(item.book.rating) }}</span>
        }
      </button>
    }
  </div>

  @if (current(); as book) {
    <div class="caption" [attr.aria-live]="moving() ? 'off' : 'polite'">
      <a class="title" [routerLink]="['/livros', book.id]">{{ book.title }}</a>
      <p class="author">{{ book.authors.join(', ') }}</p>
      @if (detail.value()?.synopsis; as synopsis) {
        <p class="synopsis">{{ synopsis }}</p>
      }
    </div>
  }

  @if (books().length > 1) {
    <div class="controls">
      <button class="round" type="button" aria-label="Livro anterior" (click)="step(-1)">
        <ml-icon name="chevron-left" [size]="18" />
      </button>
      <span class="position">{{ position() }}</span>
      <button class="round" type="button" aria-label="Próximo livro" (click)="step(1)">
        <ml-icon name="chevron-right" [size]="18" />
      </button>
      <button
        class="round"
        type="button"
        [attr.aria-label]="
          paused() ? 'Retomar a passagem dos favoritos' : 'Pausar a passagem dos favoritos'
        "
        [attr.aria-pressed]="paused()"
        (click)="paused.set(!paused())"
      >
        <ml-icon [name]="paused() ? 'play' : 'pause'" [size]="16" />
      </button>
    </div>
  }
</section>
