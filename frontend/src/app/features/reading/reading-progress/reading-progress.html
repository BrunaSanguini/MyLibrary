<div
  class="ring"
  role="img"
  [attr.aria-label]="pagesRead() + ' de ' + (pageCount() ?? '?') + ' páginas lidas'"
>
  <svg viewBox="0 0 240 240" aria-hidden="true">
    <circle class="rim" cx="120" cy="120" r="116" />
    <circle class="track" cx="120" cy="120" [attr.r]="radius" />
    <circle
      class="arc"
      cx="120"
      cy="120"
      [attr.r]="radius"
      [attr.stroke-dasharray]="dash()"
      transform="rotate(-90 120 120)"
    />
  </svg>
  <span class="center" aria-hidden="true">
    <span class="read">
      <b>{{ pagesRead() }}</b>
      @if (pageCount(); as total) {
        <span class="total">/ {{ total }}</span>
      }
    </span>
    <span class="caption">Páginas lidas</span>
  </span>
</div>

<div class="text">
  <p class="percent">{{ percent() }}%</p>
  <p class="headline">{{ headline() }}</p>
  @if (forecast(); as forecast) {
    <p class="forecast">{{ forecast }}</p>
  }
</div>
