<article class="card" [attr.aria-label]="title()">
  <header class="top">
    <h3>{{ title() }}</h3>
    @if (reached()) {
      <p class="reached"><ml-icon name="check" [size]="14" /> Meta alcançada</p>
    }
  </header>

  <ml-progress-bar [value]="goal().percent" [label]="'Progresso de ' + title()" />
  <p class="progress">
    <span>{{ progress() }}</span>
    <span class="percent">{{ goal().percent }}%</span>
  </p>

  @if (editing()) {
    <form class="edit" novalidate (submit)="save($event)">
      <label [for]="'meta-' + goal().id">Nova meta</label>
      <div class="edit-row">
        <input
          type="number"
          step="1"
          inputmode="numeric"
          [id]="'meta-' + goal().id"
          [value]="draft()"
          [attr.aria-invalid]="error() ? 'true' : null"
          [attr.aria-describedby]="error() ? 'erro-meta-' + goal().id : null"
          (input)="type($event)"
        />
        <button mlButton="primary" type="submit" [disabled]="saving()">Salvar</button>
        <button mlButton="secondary" type="button" (click)="editing.set(false)">Cancelar</button>
      </div>
      @if (error()) {
        <p class="error" role="alert" [id]="'erro-meta-' + goal().id">{{ error() }}</p>
      }
    </form>
  } @else {
    <div class="actions">
      <button
        mlButton="secondary"
        type="button"
        [attr.aria-label]="'Alterar a meta de ' + title()"
        (click)="edit()"
      >
        <ml-icon name="edit" [size]="16" /> Alterar
      </button>
      <button
        mlButton="secondary"
        type="button"
        [attr.aria-label]="'Excluir a meta de ' + title()"
        (click)="deleteRequested.emit()"
      >
        <ml-icon name="trash" [size]="16" /> Excluir
      </button>
    </div>
  }
</article>
