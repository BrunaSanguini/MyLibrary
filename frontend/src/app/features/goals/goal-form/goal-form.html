<form class="form" aria-labelledby="titulo-meta" novalidate (submit)="save($event)">
  <h2 id="titulo-meta">Nova meta para {{ year() }}</h2>

  @if (failure()) {
    <p class="failure" role="alert">{{ failure() }}</p>
  }

  <div class="field">
    <label for="tipo-meta">O que contar</label>
    <select id="tipo-meta" [formField]="goalForm.type">
      @for (type of types; track type.value) {
        <option [value]="type.value">{{ type.label }}</option>
      }
    </select>
  </div>

  @if (yearlyOnly()) {
    <p class="hint">As releituras são contadas pelo ano inteiro.</p>
  } @else {
    <fieldset class="period">
      <legend>Período</legend>
      <label class="choice">
        <input type="radio" value="YEAR" [formField]="goalForm.period" />
        O ano inteiro
      </label>
      <label class="choice">
        <input type="radio" value="MONTH" [formField]="goalForm.period" />
        Um mês
      </label>
    </fieldset>
  }

  @if (monthly()) {
    <div class="field">
      <label for="mes-meta">Mês</label>
      <select id="mes-meta" [formField]="goalForm.month">
        @for (month of months; track month.value) {
          <option [value]="month.value">{{ month.label }}</option>
        }
      </select>
    </div>
  }

  <div class="field">
    <label for="alvo-meta">{{ targetLabel() }}</label>
    <input
      id="alvo-meta"
      type="number"
      step="1"
      inputmode="numeric"
      [formField]="goalForm.target"
      [attr.aria-describedby]="errorOf(goalForm.target) ? 'erro-alvo-meta' : null"
    />
    @if (errorOf(goalForm.target); as message) {
      <p id="erro-alvo-meta" class="error">{{ message }}</p>
    }
  </div>

  <div class="actions">
    <p class="confirmation" role="status">{{ confirmation() }}</p>
    <button mlButton="primary" type="submit" [disabled]="goalForm().submitting()">
      {{ goalForm().submitting() ? 'Salvando…' : 'Criar meta' }}
    </button>
  </div>
</form>
