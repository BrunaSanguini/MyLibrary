<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Ex·Libru</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!--
      Applies the theme before the first paint, so the page never flashes the wrong theme.
      Keep in sync with ThemeStore (core/theme/theme-store.ts): same key and same rules.
    -->
    <script>
      (() => {
        let preference = 'DARK';
        try {
          preference = localStorage.getItem('ml-theme-preference') ?? 'DARK';
        } catch {}
        document.documentElement.dataset.theme = preference === 'LIGHT' ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <ml-root></ml-root>
  </body>
</html>
