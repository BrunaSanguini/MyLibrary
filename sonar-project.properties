# SonarQube Cloud analysis, run by the sonar job of .github/workflows/ci.yml (docs/ci-cd.md).
sonar.organization=brunasanguini
sonar.projectKey=BrunaSanguini_MyLibrary
sonar.projectName=Minha Livraria
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test,frontend/src,frontend/e2e
sonar.test.inclusions=frontend/src/**/*.spec.ts,frontend/e2e/**/*
sonar.exclusions=frontend/src/**/*.spec.ts,frontend/src/test-setup.ts,frontend/src/testing-matchers.d.ts,frontend/src/app/core/api/schema.d.ts

# Entry points and wiring, covered by the E2E tests instead of unit tests.
sonar.coverage.exclusions=frontend/src/main.ts,frontend/src/app/app.config.ts,frontend/src/app/app.routes.ts,backend/src/main/java/**/MinhaLivrariaApplication.java

sonar.java.source=25
sonar.java.binaries=backend/target/classes
sonar.coverage.jacoco.xmlReportPaths=coverage-reports/jacoco.xml
sonar.javascript.lcov.reportPaths=coverage-reports/lcov-unit.info,coverage-reports/lcov-browser.info

# The job fails when the quality gate fails.
sonar.qualitygate.wait=true
