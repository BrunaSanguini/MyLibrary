# User-facing texts of API errors, in Brazilian Portuguese (docs/erros.md).
# Keys: problem.<code>.title and problem.<code>.detail. The detail accepts arguments {0}, {1}...

problem.validation.title=Dados inválidos
problem.validation.detail=Um ou mais campos não passaram na validação.

problem.request.malformed.title=Requisição inválida
problem.request.malformed.detail=O corpo ou os parâmetros da requisição não estão no formato esperado.
problem.request.invalid.title=Requisição não atendida
problem.request.invalid.detail=A requisição não pôde ser atendida da forma como foi enviada.
problem.request.invalid-sort.title=Ordenação inválida
problem.request.invalid-sort.detail=O campo de ordenação informado não é aceito por este endereço.
problem.request.missing-header.title=Requisição bloqueada
problem.request.missing-header.detail=Alterações precisam vir da interface da Minha Livraria.
problem.request.invalid-host.title=Endereço não permitido
problem.request.invalid-host.detail=A Minha Livraria só atende pelo endereço local (localhost ou 127.0.0.1).
problem.request.invalid-token.title=Token inválido
problem.request.invalid-token.detail=O encerramento do aplicativo exige o token do My Collection.
problem.request.method-not-allowed.title=Método não permitido
problem.request.method-not-allowed.detail=Este endereço não aceita o método HTTP usado.
problem.request.unsupported-media-type.title=Formato não suportado
problem.request.unsupported-media-type.detail=O formato do corpo da requisição não é aceito por este endereço.

problem.resource.not-found.title=Recurso não encontrado
problem.resource.not-found.detail=O endereço solicitado não existe.

problem.internal.error.title=Erro inesperado
problem.internal.error.detail=Algo deu errado. Os detalhes foram registrados no log da aplicação.

problem.image.not-found.title=Imagem não encontrada
problem.image.not-found.detail=A imagem solicitada não existe.
problem.image.invalid-type.title=Formato de imagem não aceito
problem.image.invalid-type.detail=Envie uma imagem JPEG, PNG ou WebP.
problem.image.too-large.title=Imagem muito grande
problem.image.too-large.detail=A imagem passa do limite de 5 MB.
