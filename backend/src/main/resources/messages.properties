problem.author.not-found.title=Autor não encontrado
problem.author.not-found.detail=O autor solicitado não existe.
problem.author.has-books.title=Autor com livros
problem.author.has-books.detail=Exclua ou troque o autor dos livros dele antes de excluí-lo.
problem.publisher.not-found.title=Editora não encontrada
problem.publisher.not-found.detail=A editora solicitada não existe.
problem.publisher.name-duplicated.title=Editora já cadastrada
problem.publisher.name-duplicated.detail=Já existe uma editora com este nome.
problem.series.not-found.title=Série não encontrada
