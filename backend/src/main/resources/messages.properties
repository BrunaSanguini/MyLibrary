problem.image.too-large.title=Imagem muito grande
problem.image.too-large.detail=A imagem passa do limite de 5 MB.

problem.book.not-found.title=Livro não encontrado
problem.book.not-found.detail=O livro solicitado não existe.
problem.book.isbn-duplicated.title=ISBN já cadastrado
